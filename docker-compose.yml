services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lenny_local_dev}
      POSTGRES_DB: lenny
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  model-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama pull "$$OLLAMA_MODEL" && ollama pull "$$EMBEDDING_MODEL"']
    depends_on:
      ollama:
        condition: service_healthy

  ingest:
    build: ./backend
    user: root
    environment:
      DATABASE_URL: postgresql+asyncpg://lenny:${POSTGRES_PASSWORD:-lenny_local_dev}@db:5432/lenny
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    volumes:
      - ./data:/data
    command: ["/bin/sh", "-c", "python -m scripts.fetch_transcripts --output /data/raw/lenny && python -m scripts.ingest /data/raw/lenny/podcasts"]
    depends_on:
      db:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://lenny:${POSTGRES_PASSWORD:-lenny_local_dev}@db:5432/lenny
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-ollama}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      RETRIEVAL_THRESHOLD: ${RETRIEVAL_THRESHOLD:-0.55}
      TOP_K: ${TOP_K:-5}
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      ingest:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
